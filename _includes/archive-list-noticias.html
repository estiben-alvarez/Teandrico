{% assign noticias_sorted = site.noticias | sort: 'date' | reverse %}
{% for post in noticias_sorted %}
<div class="article-list-item" style="background:var(--color-background-primary, #fff);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;margin-bottom:1.5rem;">
  {% if post.header.teaser %}
  <a href="{{ post.url }}" style="display:block;position:relative;height:300px;overflow:hidden;">
    <img src="{{ post.header.teaser }}" alt="{{ post.title }}" style="width:100%;height:100%;object-fit:cover;">
    <div style="position:absolute;bottom:0;left:0;right:0;padding:1rem;background:linear-gradient(to top,rgba(26,26,26,0.92),transparent);">
      <span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;background:#f5c842;color:#1a1a1a;padding:2px 8px;border-radius:3px;display:inline-block;margin-bottom:0.4rem;">Noticias</span>
      <p style="font-family:Georgia,serif;font-size:1rem;font-weight:normal;margin:0;line-height:1.3;color:#fff;">{{ post.title }}</p>
    </div>
  </a>
  {% endif %}
  <div style="padding:0.8rem 1rem;">
    <p style="font-size:0.78rem;color:var(--color-text-secondary);margin:0 0 0.5rem;">{{ post.date | date: "%B %d, %Y" }}</p>
    <p style="font-size:0.9rem;color:var(--color-text-secondary);margin:0 0 0.8rem;line-height:1.5;">{{ post.excerpt | strip_html | truncate: 150 }}</p>
    <a href="{{ post.url }}" style="display:inline-block;padding:0.4rem 1rem;background:#1a1a1a;color:#fff!important;text-decoration:none;font-size:0.78rem;letter-spacing:0.05em;text-transform:uppercase;">Leer más</a>
  </div>
</div>
{% endfor %}
